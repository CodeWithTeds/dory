name: Record Repository Traffic

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TRAFFIC_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and Sync Traffic Metrics
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          echo "Fetching clones and views data..."
          CLONES_PAYLOAD=$(gh api /repos/${{ github.repository }}/traffic/clones)
          VIEWS_PAYLOAD=$(gh api /repos/${{ github.repository }}/traffic/views)

          CLONES_PAYLOAD="$CLONES_PAYLOAD" VIEWS_PAYLOAD="$VIEWS_PAYLOAD" node scripts/sync-traffic.js

      - name: Commit and Push Traffic History
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add traffic/
          if git diff --staged --quiet; then
            echo "No traffic changes to commit."
          else
            git commit -m "chore(traffic): update repository traffic and download metrics [skip ci]"
            git push origin main
          fi
